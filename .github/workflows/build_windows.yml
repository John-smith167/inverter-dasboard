name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --console `
            --name "SK_INVERTX_TRADERS" `
            --icon "assets/logo.ico" `
            --add-data "main.py;." `
            --add-data "database.py;." `
            --add-data "inventory.db;." `
            --add-data "assets;assets" `
            --hidden-import threading `
            --hidden-import socket `
            --hidden-import webbrowser `
            --hidden-import urllib.request `
            --collect-all streamlit `
            run_app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SK_INVERTX_TRADERS_EXE
          path: dist/SK_INVERTX_TRADERS.exe

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SK_INVERTX_Installer
          path: Output/SK_INVERTX_Installer.exe
